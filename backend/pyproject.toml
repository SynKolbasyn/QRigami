[project]
name = "qrigami"
version = "0.1.0"
description = "QR code generator site"
authors = [
    { name = "Andrew Kozmin", email = "syn.kolbasyn.06@gmail.com" }
]
license = "AGPL-3.0-or-later"
requires-python = ">=3.13, <3.14"
dependencies = [
    "hypercorn>=0.17.3",
    "litestar[cryptography,pydantic,redis,sqlalchemy]>=2.15.2",
    "pydantic-settings>=2.9.1",
]

[tool.uv]
default-groups = []

[tool.ruff]
src = ["./src/"]
lint.select = ["ALL"]
lint.ignore = ["D203", "D212"]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "ruff>=0.11.7",
]
